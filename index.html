<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%232e5848'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Zheng Zhicheng’s running history, routes and yearly patterns." />
    <script>
      try {
        document.documentElement.dataset.theme = localStorage.getItem('zz-theme') || 'light';
        const language = localStorage.getItem('zz-lang') === 'zh' ? 'zh-CN' : 'en';
        document.documentElement.lang = language;
        document.documentElement.dataset.lang = language.startsWith('zh') ? 'zh' : 'en';
      } catch (_) {}
    </script>
    <title>Running explorer — Zheng Zhicheng</title>
  </head>
