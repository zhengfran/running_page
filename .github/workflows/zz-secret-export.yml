name: zz-secret-export

# Temporary, one-off helper: encrypts the repository secrets with a throwaway
# public key so they can be re-created in another repository. Safe to delete.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the export public key
        uses: actions/checkout@v4

      - name: Encrypt repository secrets
        env:
          GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_TOKENS_JSON }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TIME_LOG_CALENDAR_ID: ${{ secrets.TIME_LOG_CALENDAR_ID }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
          FIT_ARCHIVE_SSH_KEY: ${{ secrets.FIT_ARCHIVE_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          gpg --batch --import .github/zz-secret-export.pub.asc

          encrypt() {
            local name="$1"
            local value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::$name is empty"
              return 1
            fi
            printf '%s' "$value" \
              | gpg --batch --yes --trust-model always \
                  --recipient secret-export@local \
                  --output "$RUNNER_TEMP/out/$name.gpg" \
                  --encrypt
            printf '%s: encrypted (%s bytes)\n' "$name" "$(stat -c %s "$RUNNER_TEMP/out/$name.gpg")"
          }

          encrypt GARMIN_TOKENS_JSON
          encrypt GARMIN_EMAIL
          encrypt GARMIN_PASSWORD
          encrypt GOOGLE_SERVICE_ACCOUNT_JSON
          encrypt TIME_LOG_CALENDAR_ID
          encrypt MAPBOX_TOKEN
          encrypt FIT_ARCHIVE_SSH_KEY

      - name: Upload encrypted payload
        uses: actions/upload-artifact@v4
        with:
          name: secrets-export
          retention-days: 1
          if-no-files-found: error
          path: ${{ runner.temp }}/out/*.gpg
