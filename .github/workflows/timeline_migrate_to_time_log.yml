name: Timeline → Time Log migration (one-off)

# Copies the old Workouts and Sleep Timeline calendars into the LifeOS Time Log
# in its format (ADR 0010). Manual only. Insert-only: never overwrites an event
# already in the Time Log and never deletes anything; the old calendars remain.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Read and convert only; write nothing
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: garmin-timeline-sync
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q tests/test_garmin_timeline_sync.py tests/test_migrate_timeline_to_time_log.py
      - name: Migrate
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GCAL_WORKOUTS_CALENDAR_ID: ${{ secrets.GCAL_WORKOUTS_CALENDAR_ID }}
          GCAL_SLEEP_CALENDAR_ID: ${{ secrets.GCAL_SLEEP_CALENDAR_ID }}
          TIME_LOG_CALENDAR_ID: ${{ secrets.TIME_LOG_CALENDAR_ID }}
          TIME_LOG_AREA_COLOR_ID: ${{ vars.TIME_LOG_AREA_COLOR_ID || '10' }}
        run: python run_page/migrate_timeline_to_time_log.py ${{ inputs.dry_run && '--dry-run' || '' }}
