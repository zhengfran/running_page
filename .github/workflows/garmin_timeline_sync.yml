name: Garmin Timeline Sync

on:
  # 09:00 Singapore. Kept an hour clear of garmin_publication.yml at 00:00 UTC
  # so the two jobs never contend for a Garmin login.
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: Sync Window width in days (30 for the one-time backfill)
        required: false
        type: string
        default: '7'

permissions:
  contents: read

concurrency:
  group: garmin-timeline-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror Garmin Activities and Sleep to the LifeOS Time Log
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Timeline Sync tests
        run: pytest -q tests/test_garmin_timeline_sync.py

      - name: Sync the Timeline
        env:
          GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_TOKENS_JSON }}
          # Fallback credentials: if the cached token is rejected, garminconnect
          # discards it and does a fresh login instead of hard-failing.
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # The owner's LifeOS Time Log. It must be shared with the service
          # account's client_email with "Make changes to events" (ADR 0010).
          TIME_LOG_CALENDAR_ID: ${{ secrets.TIME_LOG_CALENDAR_ID }}
          # LifeOS Area colour for Sleep and workouts: 10 = Health (Basil).
          TIME_LOG_AREA_COLOR_ID: ${{ vars.TIME_LOG_AREA_COLOR_ID || '10' }}
        run: python run_page/garmin_timeline_sync.py --days "${{ inputs.days || 7 }}"
