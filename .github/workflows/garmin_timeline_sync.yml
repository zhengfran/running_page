name: Garmin Timeline Sync

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: Sync Window width in days (30 for the one-time backfill)
        required: false
        type: string
        default: '7'

permissions:
  contents: read

concurrency:
  group: garmin-timeline-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Mirror Garmin Activities and Sleep to the Timeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Timeline Sync tests
        run: pytest -q tests/test_garmin_timeline_sync.py

      - name: Sync the Timeline
        env:
          GARMIN_TOKENS_JSON: ${{ secrets.GARMIN_TOKENS_JSON }}
          # Fallback credentials: if the cached token is rejected, garminconnect
          # discards it and does a fresh login instead of hard-failing.
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GCAL_WORKOUTS_CALENDAR_ID: ${{ secrets.GCAL_WORKOUTS_CALENDAR_ID }}
          GCAL_SLEEP_CALENDAR_ID: ${{ secrets.GCAL_SLEEP_CALENDAR_ID }}
        run: python run_page/garmin_timeline_sync.py --days "${{ inputs.days || 7 }}"
